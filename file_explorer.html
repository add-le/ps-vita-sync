<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"
    />
    <link rel="stylesheet" type="text/css" href="./file_explorer.css" />
    <title>File explorer</title>
  </head>
  <body onload="init()">
    <header id="header" class="kanit-regular">
      <div class="header-selected">
        <span onclick="deselectAll()" class="material-symbols-outlined"
          >close</span
        >
        <div id="header-text">0 item</div>
      </div>
      <div class="header-actions">
        <span onclick="cloudSync()" class="material-symbols-outlined"
          >cloud_sync</span
        >
        <span onclick="selectAll()" class="material-symbols-outlined"
          >select_all</span
        >
      </div>
    </header>

    <div id="container" class="kanit-regular"></div>

    <script type="text/javascript" src="./file_explorer.js"></script>
  </body>
</html>
